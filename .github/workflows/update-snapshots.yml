name: Update screenshot baselines

# Makes the screenshot baselines, one file per screen that every run compares (d289). Run it by hand on a branch whose
# change moves pixels on purpose: Actions tab, or `gh workflow run update-snapshots.yml --ref <branch>`. It commits them to
# the branch it ran on (never to main) and hands them back as a download too; they reach main only through the pull
# request, where the maintainer looks at them before it merges. A local run of the visual area with `--update-snapshots`
# makes the same files.
on:
  workflow_dispatch:

permissions:
  contents: write # commits the baselines to the branch it ran on, never to main

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Make the baselines (CI is cleared so a missing baseline is written, not skipped; software WebGL as in CI)
        # only the spec with screenshots: the other specs of the visual area check behaviour and make no baselines
        run: npx playwright test tests/e2e/visual.spec.ts --project=visual --update-snapshots=all --workers=1 --timeout=600000
        env:
          CI: ''
          PW_EXPECT_TIMEOUT: '120000'
      - uses: actions/upload-artifact@v7
        if: always() # the baselines that were made, even when a test failed
        with:
          name: screenshot-baselines
          path: tests/e2e/*-snapshots/*-chromium.png
          if-no-files-found: error
          retention-days: 14
      - name: Commit the baselines to the branch (never to main)
        if: github.ref_name != 'main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots/*-chromium.png
          if git diff --cached --quiet; then echo "no baseline changed"; exit 0; fi
          git commit -m "Screenshot baselines"
          git push origin "HEAD:${{ github.ref_name }}"
