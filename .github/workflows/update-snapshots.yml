name: Update screenshot baselines (Windows)

# The baselines are made on Windows, the source of truth (the game is played on Windows; d062), and checked on Windows and
# Linux alike (one file per screen, d288). Run this by hand on a branch whose change
# moves pixels on purpose: Actions tab, or `gh workflow run update-snapshots.yml --ref <branch>`. It makes the baselines on
# the same kind of hosted Windows runner the "visual (Windows)" job of CI checks against, commits them to the branch it ran on
# (never to main) and hands them back as a download too. They reach main only through the pull request, where the maintainer
# looks at them before it merges. A cloud session (Linux) cannot make a Windows baseline nor download an artifact: it fetches
# the branch.
on:
  workflow_dispatch:

permissions:
  contents: write # commits the baselines to the branch it ran on, never to main

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - name: Make the baselines (CI is cleared so a missing baseline is written, not skipped; software WebGL as in CI)
        # only the spec with screenshots: the other specs of the visual area check behaviour and make no baselines
        run: npx playwright test tests/e2e/visual.spec.ts --project=visual --update-snapshots=all --workers=1 --timeout=600000
        env:
          CI: ''
          E2E_GPU: '0'
          PW_EXPECT_TIMEOUT: '120000'
      - uses: actions/upload-artifact@v7
        if: always() # the baselines that were made, even when a test failed
        with:
          name: windows-snapshots
          path: tests/e2e/*-snapshots/*-chromium.png
          if-no-files-found: error
          retention-days: 14
      - name: Commit the baselines to the branch (never to main)
        if: github.ref_name != 'main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots/*-chromium.png
          if git diff --cached --quiet; then echo "no baseline changed"; exit 0; fi
          git commit -m "Screenshot baselines made on Windows"
          git push origin "HEAD:${{ github.ref_name }}"
