# The browser jobs, called by CI (a push to a labelled pull request, the weekly and manual runs) and by "PR labels and
# edits" (adding a ci: label). One file, so both run the same jobs (d090).
name: browser tests

on:
  workflow_call:
    inputs:
      e2e:
        type: boolean
        default: false
      visual:
        type: boolean
        default: false
      full: # every area instead of the areas the pull request touches
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The browser tests (Playwright, Chromium), screenshot tests included: every run compares the one baseline per screen (d289).
  # A pull request with the `ci:e2e` label runs the areas its changes touch plus the smoke tests (on adding the label and
  # on each later push); the weekly and manual runs run every area (docs/testing.md section 10).
  e2e:
    name: e2e
    if: inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the affected areas are found by comparing with the base branch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remember the browser between runs
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests, the affected areas of a pull request
        if: ${{ !inputs.full }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: npm run test:e2e:affected -- "$BASE"
      - name: End-to-end tests, every area
        if: inputs.full
        run: npm run test:e2e
      - name: Keep the run log (summary per area, failures with the browser console, history line)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-run-log
          path: test-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The screenshot tests alone (the visual area), with the `ci:visual` label, in the weekly run and by hand, on the same
  # kind of runner as every other job (d289). On a failure the report holds the expected, actual and diff images.
  visual:
    name: visual
    if: inputs.visual
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # One test at a time with a long limit, as measured on the 2-core hosted runner.
      - name: Screenshot tests and the label check, the visual area
        run: npx playwright test --project=visual --workers=1 --timeout=240000
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-run-log-visual
          path: test-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the report with the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7
